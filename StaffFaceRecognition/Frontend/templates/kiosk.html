{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Attendance Terminal | Face Recognition Kiosk</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #818cf8;
            --secondary: #0f172a;
            --success: #10b981;
            --success-dark: #059669;
            --danger: #ef4444;
            --gray: #64748b;
            --white: #ffffff;
            --radius-xl: 1.25rem;
            --radius-2xl: 1.5rem;
            --shadow-2xl: 0 25px 50px -12px rgba(15, 23, 42, 0.4);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top, #1e1b4b 0%, #0f172a 100%);
            min-height: 100vh;
            color: var(--white);
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Top Kiosk Bar */
        .kiosk-navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.25rem 2.5rem;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .brand-icon {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
        }
        .brand-text h1 { font-size: 1.25rem; font-weight: 700; }
        .brand-text p { font-size: 0.75rem; color: #94a3b8; letter-spacing: 0.5px; }

        .clock-widget {
            text-align: right;
        }
        .clock-time {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 1px;
            font-variant-numeric: tabular-nums;
            color: #f8fafc;
        }
        .clock-date {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .portal-link {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.6rem 1.1rem;
            background: rgba(255, 255, 255, 0.1);
            color: var(--white);
            border-radius: 9999px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .portal-link:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        /* Center Kiosk Terminal Body */
        .terminal-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
        }

        .kiosk-card {
            width: 100%;
            max-width: 680px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: var(--radius-2xl);
            padding: 2rem;
            box-shadow: var(--shadow-2xl);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Camera Source & Management Toolbar */
        .camera-toolbar {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.75rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-xl);
            padding: 0.6rem 1rem;
            margin-bottom: 1.25rem;
        }
        .source-selector {
            display: flex;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 9999px;
            padding: 3px;
            gap: 3px;
        }
        .source-btn {
            border: none;
            background: transparent;
            color: #94a3b8;
            padding: 0.35rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .source-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 2px 6px rgba(79, 70, 229, 0.4);
        }

        .device-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .cam-select {
            background: rgba(15, 23, 42, 0.8);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 0.5rem;
            padding: 0.35rem 0.6rem;
            font-size: 0.78rem;
            outline: none;
            cursor: pointer;
            max-width: 170px;
        }
        .btn-icon-cam {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            border-radius: 0.5rem;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-icon-cam:hover { background: rgba(255, 255, 255, 0.2); }

        /* Video Display Box */
        .video-box {
            position: relative;
            width: 100%;
            max-width: 580px;
            aspect-ratio: 4/3;
            background: #000;
            border-radius: var(--radius-xl);
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 3px solid rgba(255, 255, 255, 0.15);
        }
        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        #fallbackStream {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .face-oval {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 230px;
            height: 290px;
            border: 2px dashed rgba(255, 255, 255, 0.8);
            border-radius: 50% 50% 45% 45%;
            pointer-events: none;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.25);
            transition: all 0.3s;
        }
        .face-oval.active {
            border-color: var(--success);
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.2), 0 0 20px rgba(16, 185, 129, 0.6);
        }

        .scanning-bar {
            position: absolute;
            top: 15%;
            left: calc(50% - 115px);
            width: 230px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #6366f1, #10b981, transparent);
            box-shadow: 0 0 8px #6366f1;
            border-radius: 3px;
            animation: scanMove 2.5s ease-in-out infinite alternate;
        }
        @keyframes scanMove {
            0% { top: 20%; opacity: 0.4; }
            100% { top: 75%; opacity: 0.9; }
        }

        .flash-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease-out;
        }
        .flash-overlay.active { opacity: 0.85; }

        /* Big Kiosk Buttons */
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            width: 100%;
            max-width: 580px;
            margin-top: 1.5rem;
        }
        .btn-kiosk {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            padding: 1.25rem 1.5rem;
            border-radius: var(--radius-xl);
            font-size: 1.25rem;
            font-weight: 800;
            color: white;
            border: none;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 0.5px;
            user-select: none;
        }
        .btn-check-in {
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.35);
        }
        .btn-check-in:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 30px rgba(16, 185, 129, 0.5);
        }
        .btn-check-out {
            background: linear-gradient(135deg, #d97706 0%, #f59e0b 100%);
            box-shadow: 0 8px 25px rgba(245, 158, 11, 0.35);
        }
        .btn-check-out:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 30px rgba(245, 158, 11, 0.5);
        }
        .btn-kiosk:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* Result Feedback Card */
        .result-card {
            width: 100%;
            max-width: 580px;
            margin-top: 1.25rem;
            border-radius: var(--radius-xl);
            padding: 1rem 1.25rem;
            display: none;
            align-items: center;
            gap: 1rem;
            border: 2px solid transparent;
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result-card.success {
            border-color: var(--success);
            background: rgba(6, 78, 59, 0.5);
            display: flex;
        }
        .result-card.error {
            border-color: var(--danger);
            background: rgba(127, 29, 29, 0.5);
            display: flex;
        }
        .result-card.loading {
            border-color: var(--primary);
            background: rgba(30, 27, 75, 0.6);
            display: flex;
        }
        .result-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            flex-shrink: 0;
            overflow: hidden;
            border: 2px solid white;
        }
        .result-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .result-info { flex: 1; }
        .result-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 0.15rem; }
        .result-details { font-size: 0.85rem; color: #cbd5e1; }

        .spinner {
            width: 26px;
            height: 26px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <!-- Top Bar -->
    <header class="kiosk-navbar">
        <div class="brand">
            <div class="brand-icon">
                <span class="material-icons-round">camera_indoor</span>
            </div>
            <div class="brand-text">
                <h1>System Role: Attendance Kiosk</h1>
                <p><span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #10b981; margin-right: 4px;"></span> Standalone Hardware Terminal &bull; No Session Required</p>
            </div>
        </div>

        <div class="clock-widget">
            <div class="clock-time" id="digitalClock">--:--:--</div>
            <div class="clock-date" id="digitalDate">Loading date...</div>
        </div>

        <div style="display: flex; align-items: center; gap: 0.75rem;">
            <div style="background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.4); padding: 0.45rem 0.85rem; border-radius: 9999px; font-size: 0.75rem; color: #34d399; font-weight: 600;">
                <span style="display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #34d399; margin-right: 4px;"></span>
                Role: System Active
            </div>
            <a href="{% url 'logout' %}" class="portal-link" style="background: rgba(239, 68, 68, 0.2); border-color: rgba(239, 68, 68, 0.4);">
                <span class="material-icons-round" style="font-size: 1.1rem; color: #f87171;">logout</span>
                <span>Logout (Exit Kiosk)</span>
            </a>
        </div>
    </header>

    <!-- Main Terminal Area -->
    <main class="terminal-container">
        <div class="kiosk-card">
            <!-- Camera Source & Management Toolbar -->
            <div class="camera-toolbar">
                <div class="source-selector">
                    <button type="button" class="source-btn active" id="srcClientBtn" onclick="setCameraSource('client')">
                        <span class="material-icons-round" style="font-size: 0.95rem;">videocam</span>
                        <span>This Device Cam</span>
                    </button>
                    <button type="button" class="source-btn" id="srcServerBtn" onclick="setCameraSource('server')">
                        <span class="material-icons-round" style="font-size: 0.95rem;">sensors</span>
                        <span>Server Stream</span>
                    </button>
                </div>

                <div class="device-controls" id="clientControls">
                    <select id="kioskCameraSelect" class="cam-select" onchange="switchClientCamera(this.value)">
                        <option value="">Default Camera</option>
                    </select>
                    <button type="button" class="btn-icon-cam" onclick="toggleFacing()" title="Flip camera (Mobile/Tablet)">
                        <span class="material-icons-round" style="font-size: 1rem;">flip_camera_ios</span>
                    </button>
                </div>
            </div>

            <!-- Video Display Box -->
            <div class="video-box">
                <video id="webcam" autoplay playsinline muted></video>
                <img id="fallbackStream" alt="Server Live Stream" />
                <div class="face-oval" id="faceOval"></div>
                <div class="scanning-bar"></div>
                <div class="flash-overlay" id="flashOverlay"></div>
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button type="button" class="btn-kiosk btn-check-in" id="checkInBtn" onclick="performAction('check_in')">
                    <span class="material-icons-round" style="font-size: 1.5rem;">login</span>
                    <span>CHECK IN</span>
                </button>

                <button type="button" class="btn-kiosk btn-check-out" id="checkOutBtn" onclick="performAction('check_out')">
                    <span class="material-icons-round" style="font-size: 1.5rem;">logout</span>
                    <span>CHECK OUT</span>
                </button>
            </div>

            <!-- Result Feedback Card -->
            <div class="result-card" id="resultCard">
                <div class="result-avatar" id="resultAvatar">
                    <span class="material-icons-round">person</span>
                </div>
                <div class="result-info">
                    <div class="result-title" id="resultTitle">Processing...</div>
                    <div class="result-details" id="resultDetails">Please look directly at the camera</div>
                </div>
            </div>
        </div>
    </main>

    <!-- Hidden canvas for client frame snapshot -->
    <canvas id="snapshotCanvas" style="display: none;"></canvas>

    <script>
        // Dynamically resolve backend host to server's IP address (works on any device/computer)
        const BACKEND_HOST = window.location.hostname || "{{ ip|default:'127.0.0.1' }}";
        const BACKEND_URL = `http://${BACKEND_HOST}:5600`;

        const video = document.getElementById('webcam');
        const fallbackImg = document.getElementById('fallbackStream');
        const canvas = document.getElementById('snapshotCanvas');
        const flashOverlay = document.getElementById('flashOverlay');
        const faceOval = document.getElementById('faceOval');
        const resultCard = document.getElementById('resultCard');
        const resultAvatar = document.getElementById('resultAvatar');
        const resultTitle = document.getElementById('resultTitle');
        const resultDetails = document.getElementById('resultDetails');
        const checkInBtn = document.getElementById('checkInBtn');
        const checkOutBtn = document.getElementById('checkOutBtn');
        const kioskCameraSelect = document.getElementById('kioskCameraSelect');
        const clientControls = document.getElementById('clientControls');
        const srcClientBtn = document.getElementById('srcClientBtn');
        const srcServerBtn = document.getElementById('srcServerBtn');

        let isProcessing = false;
        let clearTimer = null;
        let activeSource = 'client'; // 'client' or 'server'
        let currentStream = null;
        let currentFacingMode = 'user';
        let currentDeviceId = null;

        // Clock Update
        function updateClock() {
            const now = new Date();
            document.getElementById('digitalClock').textContent = now.toLocaleTimeString([], { hour12: true });
            document.getElementById('digitalDate').textContent = now.toLocaleDateString([], {
                weekday: 'long', year: 'numeric', month: 'short', day: 'numeric'
            });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Enumerate Cameras
        async function enumerateClientCameras() {
            try {
                if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(d => d.kind === 'videoinput');

                kioskCameraSelect.innerHTML = '';
                if (videoDevices.length === 0) {
                    const opt = document.createElement('option');
                    opt.value = '';
                    opt.textContent = 'Default Camera';
                    kioskCameraSelect.appendChild(opt);
                    return;
                }

                videoDevices.forEach((dev, idx) => {
                    const opt = document.createElement('option');
                    opt.value = dev.deviceId;
                    opt.textContent = dev.label || `Camera ${idx + 1}`;
                    if (currentDeviceId && dev.deviceId === currentDeviceId) opt.selected = true;
                    kioskCameraSelect.appendChild(opt);
                });
            } catch (e) {
                console.warn("Could not list video devices:", e);
            }
        }

        // Camera Source Switcher
        function setCameraSource(mode) {
            activeSource = mode;
            if (mode === 'client') {
                srcClientBtn.classList.add('active');
                srcServerBtn.classList.remove('active');
                clientControls.style.display = 'flex';
                fallbackImg.style.display = 'none';
                fallbackImg.src = '';
                video.style.display = 'block';
                startClientCamera();
            } else {
                srcServerBtn.classList.add('active');
                srcClientBtn.classList.remove('active');
                clientControls.style.display = 'none';
                stopClientCamera();
                video.style.display = 'none';
                fallbackImg.style.display = 'block';
                fallbackImg.src = `${BACKEND_URL}/video_stream`;
                faceOval.classList.add('active');
            }
        }

        async function startClientCamera() {
            stopClientCamera();

            const constraints = {
                audio: false,
                video: {
                    width: { ideal: 640 },
                    height: { ideal: 480 }
                }
            };

            if (currentDeviceId) {
                constraints.video.deviceId = { exact: currentDeviceId };
            } else {
                constraints.video.facingMode = currentFacingMode;
            }

            try {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error("getUserMedia not supported (may require HTTPS when accessed on external network).");
                }
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
                faceOval.classList.add('active');
                await enumerateClientCameras();
            } catch (err) {
                console.warn("Client camera failed, switching to server stream fallback:", err);
                setCameraSource('server');
            }
        }

        function stopClientCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(t => t.stop());
                currentStream = null;
            }
            if (video) video.srcObject = null;
        }

        function switchClientCamera(deviceId) {
            currentDeviceId = deviceId || null;
            startClientCamera();
        }

        function toggleFacing() {
            currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
            currentDeviceId = null;
            startClientCamera();
        }

        window.addEventListener('load', () => {
            setCameraSource('client');
        });

        function triggerFlash() {
            flashOverlay.classList.add('active');
            setTimeout(() => flashOverlay.classList.remove('active'), 150);
        }

        // Capture Frame from Client Device Webcam
        function captureClientFrame() {
            try {
                if (video.srcObject && video.videoWidth > 0) {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    return canvas.toDataURL('image/jpeg', 0.9);
                }
            } catch (e) {
                console.error("Frame capture error:", e);
            }
            return null;
        }

        function showResult(type, title, details, photoUrl = null) {
            clearTimeout(clearTimer);
            resultCard.className = `result-card ${type}`;
            resultTitle.textContent = title;
            resultDetails.innerHTML = details;

            if (type === 'loading') {
                resultAvatar.innerHTML = `<div class="spinner"></div>`;
            } else if (photoUrl) {
                resultAvatar.innerHTML = `<img src="${photoUrl}" alt="Staff" />`;
            } else {
                resultAvatar.innerHTML = `<span class="material-icons-round">${type === 'success' ? 'check' : 'priority_high'}</span>`;
            }

            resultCard.style.display = 'flex';

            if (type !== 'loading') {
                clearTimer = setTimeout(() => {
                    resultCard.style.display = 'none';
                }, 6000);
            }
        }

        async function performAction(actionType) {
            if (isProcessing) return;
            isProcessing = true;
            checkInBtn.disabled = true;
            checkOutBtn.disabled = true;

            const actionLabel = actionType === 'check_in' ? 'Check-In' : 'Check-Out';
            showResult('loading', `Processing ${actionLabel}...`, "Recognizing face. Please hold still...");

            triggerFlash();

            try {
                let response = null;
                const endpoint = actionType === 'check_in' ? `${BACKEND_URL}/check-in` : `${BACKEND_URL}/check-out`;

                if (activeSource === 'client') {
                    const frameData = captureClientFrame();
                    if (!frameData) {
                        showResult('error', `${actionLabel} Failed`, "Could not capture image from device camera.");
                        isProcessing = false;
                        checkInBtn.disabled = false;
                        checkOutBtn.disabled = false;
                        return;
                    }

                    response = await fetch(endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ image: frameData })
                    });
                } else {
                    // Server Hardware Camera Stream mode
                    response = await fetch(endpoint, {
                        method: 'GET'
                    });
                }

                const data = await response.json();

                if (response.ok && data.status === 'success') {
                    const emp = data.employee || {};
                    const name = emp.name || 'Faculty Member';
                    const id = emp.id || '';
                    const dept = emp.department || '';
                    const time = emp.time || new Date().toLocaleTimeString();

                    showResult(
                        'success',
                        `${actionLabel} Successful!`,
                        `<strong>${name}</strong> (${id})<br><span style="color:#94a3b8">${dept} &bull; Time: ${time}</span>`,
                        `/media/profile_pics/${id}.jpg`
                    );
                } else {
                    const errorMsg = data.detail || data.message || "Face not recognized. Please face the camera and try again.";
                    showResult('error', `${actionLabel} Failed`, errorMsg);
                }
            } catch (err) {
                console.error("Attendance API error:", err);
                showResult('error', "Connection Error", `Could not reach recognition service at ${BACKEND_URL}. Verify backend status.`);
            } finally {
                isProcessing = false;
                checkInBtn.disabled = false;
                checkOutBtn.disabled = false;
            }
        }

        window.addEventListener('beforeunload', stopClientCamera);
    </script>
</body>
</html>
