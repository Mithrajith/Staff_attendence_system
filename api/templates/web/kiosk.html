<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Faculty Check In / Out</title>
  <link rel="icon" href="/static/img/image.png" type="image/png">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --blue: #1a73e8;
      --success: #188038;
      --danger: #d93025;
      --surface: #ffffff;
      --border: #dadce0;
      --text: #202124;
      --muted: #5f6368;
      --radius: 12px;
    }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      font: 18px/1.4 "Google Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #1a1a1a;
      color: var(--text);
      overflow: hidden;
    }

    /* ---- Camera feed ---- */
    #cam {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      background: #111;
    }

    /* ---- Face guide oval ---- */
    #guide {
      position: fixed;
      left: 50%;
      top: 46%;
      width: min(40vh, 68vw);
      height: min(52vh, 88vw);
      transform: translate(-50%, -50%);
      border: 2.5px solid rgba(255,255,255,.7);
      border-radius: 50%;
      box-shadow: 0 0 0 2px rgba(0,0,0,.2);
      pointer-events: none;
      transition: border-color .3s;
    }
    body.counting #guide {
      border-color: rgba(24,128,56,.85);
      box-shadow: 0 0 0 2px rgba(24,128,56,.3), 0 0 24px rgba(24,128,56,.25);
    }

    /* ---- Top bar (glass) ---- */
    #top {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      background: rgba(255,255,255,.9);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255,255,255,.4);
    }
    #top .brand {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--blue);
    }
    #top #clock {
      font-size: 14px;
      color: var(--muted);
      font-weight: 500;
    }
    #top a#logout {
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
      cursor: pointer;
      padding: 5px 12px;
      border: 1px solid var(--border);
      border-radius: 20px;
      transition: background .15s;
    }
    #top a#logout:hover { background: #f1f3f4; }

    /* ---- Prompt pill ---- */
    #prompt {
      position: fixed;
      left: 50%;
      bottom: 40px;
      transform: translateX(-50%);
      max-width: 90vw;
      padding: 12px 28px;
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 30px;
      font-size: 18px;
      font-weight: 600;
      text-align: center;
      color: var(--text);
      white-space: nowrap;
      box-shadow: 0 2px 12px rgba(0,0,0,.18);
    }

    .hidden { display: none !important; }

    /* ---- Overlays ---- */
    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.45);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    /* ---- Card (popup & confirm) ---- */
    .card {
      width: min(92vw, 420px);
      padding: 28px 32px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,.2);
    }
    .card svg { display: block; margin: 0 auto; }

    /* ---- Success tick ---- */
    #tick { width: 80px; height: 80px; }

    /* ---- Popup text ---- */
    #pTitle {
      margin: 14px 0 4px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    #popup.err #pTitle {
      color: var(--danger);
      font-size: 22px;
      letter-spacing: 0;
      text-transform: none;
      font-weight: 600;
    }
    #popup.err #pName { font-size: 18px; }
    #pName {
      font-size: 26px;
      font-weight: 600;
      line-height: 1.25;
      color: var(--text);
    }
    #pDept, #pEmp { color: var(--muted); font-size: 16px; margin-top: 2px; }
    #pAction {
      margin-top: 12px;
      font-size: 18px;
      font-weight: 600;
    }
    #pAction.in  { color: var(--success); }
    #pAction.out { color: var(--danger); }

    /* ---- Stick figures ---- */
    .man { width: 180px; height: 120px; margin-top: 8px; }
    .man-in  { color: var(--success); }
    .man-out { color: var(--danger); }
    .runner { animation: run .9s ease-out both; }
    @keyframes run {
      from { transform: translateX(-60px); opacity: 0; }
      to   { transform: none; opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) { .runner { animation: none; } }

    /* ---- Greeting fullscreen ---- */
    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px;
      background: var(--surface);
      text-align: center;
      border-top: 6px solid var(--success);
    }
    .screen.out { border-top-color: var(--danger); }
    .screen h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 5.5vw, 58px);
      line-height: 1.15;
      font-weight: 600;
    }
    .screen p {
      margin: 0;
      max-width: 720px;
      font-size: clamp(16px, 2.8vw, 28px);
      color: var(--muted);
      font-weight: 400;
    }
    #camError h1 { font-size: 26px; }

    /* ---- Confirm card ---- */
    .confirm { position: relative; }
    #cLabel {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    #cName {
      margin-top: 8px;
      font-size: 26px;
      font-weight: 600;
      line-height: 1.25;
      color: var(--text);
    }
    #cDept, #cEmp { color: var(--muted); font-size: 16px; margin-top: 2px; }
    .confirm .row {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .confirm .row button {
      flex: 1;
      padding: 16px 10px;
      font: inherit;
      font-size: 18px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity .15s;
    }
    .confirm .row button:disabled {
      opacity: .35;
      cursor: not-allowed;
    }
    #btnIn  { background: #e6f4ea; color: var(--success); }
    #btnIn:not(:disabled):hover  { background: #c6e9cf; }
    #btnOut { background: #fce8e6; color: var(--danger); }
    #btnOut:not(:disabled):hover { background: #f5c6c2; }
    #cNote {
      margin-top: 12px;
      font-size: 13px;
      color: var(--muted);
    }
    /* Close (X) button */
    .confirm .x {
      position: absolute;
      top: 0; right: 0;
      width: 40px; height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      border-radius: 50%;
      transition: background .15s;
      padding: 0;
    }
    .confirm .x:hover { background: #f1f3f4; }

    /* ---- Retry button (camera error) ---- */
    button#retry {
      margin-top: 20px;
      padding: 10px 24px;
      font: inherit;
      font-size: 15px;
      font-weight: 500;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      transition: background .15s;
    }
    button#retry:hover { background: #f1f3f4; }
  </style>
</head>

<body>
  <video id="cam" autoplay muted playsinline></video>
  <div id="guide"></div>

  <div id="top">
    <div class="brand" style="display:flex; align-items:center; gap:8px;">
      <img src="/static/img/image.png" alt="Logo" style="width:24px; height:24px; object-fit:contain; border-radius:4px;">
      Faculty Attendance
    </div>
    <span id="clock"></span>
    <a id="logout">Sign out</a>
  </div>

  <div id="prompt">Look at the camera</div>

  <!-- Confirm: is this you? -->
  <div id="confirm" class="overlay hidden">
    <div class="card confirm">
      <button type="button" id="close" class="x" aria-label="Close, this is not me">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/>
        </svg>
      </button>
      <div id="cLabel">Is this you?</div>
      <div id="cName"></div>
      <div id="cDept"></div>
      <div id="cEmp"></div>
      <div class="row">
        <button type="button" id="btnIn" data-action="check_in">Check in</button>
        <button type="button" id="btnOut" data-action="check_out">Check out</button>
      </div>
      <div id="cNote">Not you? Close this — nothing will be recorded.</div>
    </div>
  </div>

  <!-- Result popup -->
  <div id="popup" class="overlay hidden">
    <div class="card">
      <svg id="tick" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="46" fill="#188038"/>
        <polyline points="28,52 44,68 74,34" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div id="pTitle"></div>
      <div id="pName"></div>
      <div id="pDept"></div>
      <div id="pEmp"></div>

      <!-- Check in: stick man running through the door (green) -->
      <svg id="manIn" class="man man-in hidden" viewBox="0 0 200 140" aria-hidden="true" fill="none"
        stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <line x1="8" y1="130" x2="192" y2="130" stroke-width="3"/>
        <rect x="130" y="20" width="54" height="110" fill="#e6f4ea"/>
        <polygon points="130,20 112,30 112,120 130,130" fill="#fff"/>
        <circle cx="120" cy="78" r="2" fill="currentColor"/>
        <g transform="translate(86 92)">
          <g class="runner">
            <circle cx="12" cy="-42" r="8" fill="currentColor"/>
            <polyline points="0,0 8,-30"/>
            <polyline points="8,-26 22,-18 32,-28"/>
            <polyline points="8,-26 -6,-20 -14,-8"/>
            <polyline points="0,0 16,8 10,36"/>
            <polyline points="0,0 -10,16 -28,22"/>
            <line x1="-40" y1="-30" x2="-56" y2="-30" stroke-width="3"/>
            <line x1="-34" y1="-14" x2="-54" y2="-14" stroke-width="3"/>
          </g>
        </g>
      </svg>

      <!-- Check out: stick man running out past the gate (red) -->
      <svg id="manOut" class="man man-out hidden" viewBox="0 0 200 140" aria-hidden="true" fill="none"
        stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <line x1="8" y1="130" x2="192" y2="130" stroke-width="3"/>
        <path d="M26 130 V34 H78 V130"/>
        <line x1="26" y1="34" x2="40" y2="20" stroke-width="3"/>
        <line x1="78" y1="34" x2="64" y2="20" stroke-width="3"/>
        <line x1="40" y1="20" x2="64" y2="20" stroke-width="3"/>
        <g transform="translate(130 92)">
          <g class="runner">
            <circle cx="12" cy="-42" r="8" fill="currentColor"/>
            <polyline points="0,0 8,-30"/>
            <polyline points="8,-26 22,-18 32,-28"/>
            <polyline points="8,-26 -6,-20 -14,-8"/>
            <polyline points="0,0 16,8 10,36"/>
            <polyline points="0,0 -10,16 -28,22"/>
            <line x1="-34" y1="-30" x2="-50" y2="-30" stroke-width="3"/>
            <line x1="-34" y1="-14" x2="-50" y2="-14" stroke-width="3"/>
          </g>
        </g>
        <polyline points="168,60 182,70 168,80" stroke-width="3"/>
      </svg>

      <div id="pAction"></div>
    </div>
  </div>

  <!-- Greeting screen (fullscreen, check in / check out) -->
  <div id="greeting" class="screen hidden">
    <h1 id="gHead"></h1>
    <p id="gSub"></p>
  </div>

  <!-- Camera error screen -->
  <div id="camError" class="screen hidden" style="border-top-color:var(--danger)">
    <h1>Camera unavailable</h1>
    <p>Allow camera access for this page, then try again.</p>
    <button type="button" id="retry">Try again</button>
  </div>

  <script>
    const API = "{{ api }}";
    const $ = (id) => document.getElementById(id);
    const token = sessionStorage.getItem("token");
    const HOLD_MS = 3000;       // how long a face must stay in view before we identify it
    const POPUP_MS = 3500;
    const GREETING_MS = 6000;
    const CONFIRM_MS = 20000;   // the confirm window closes itself (nothing recorded) after this long
    const CLEAR_MS = 1500;      // after any outcome, the screen must be empty this long before the next person

    function signOut() { sessionStorage.removeItem("token"); location.replace("/"); }
    $("logout").addEventListener("click", signOut);
    if (!token) signOut();

    async function post(path, body) {
      const res = await fetch(API + path, {
        method: "POST",
        headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (res.status === 401 || res.status === 403) { signOut(); throw new Error("auth"); }
      if (!res.ok) throw new Error("http " + res.status);
      return res.json();
    }

    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const canvas = document.createElement("canvas");
    function frame(width, quality) {
      const v = $("cam");
      if (!v.videoWidth) return null;
      canvas.width = width;
      canvas.height = Math.round((v.videoHeight * width) / v.videoWidth);
      canvas.getContext("2d").drawImage(v, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL("image/jpeg", quality);
    }

    function setPrompt(text) { $("prompt").textContent = text; }
    function tickClock() { $("clock").textContent = new Date().toLocaleString([], { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); }
    tickClock(); setInterval(tickClock, 15000);

    // ---- Greetings: [headline, sub-line]; {n} is the first name ----
    const GREET = {
      in: {
        morning:   [["Good morning, {n}!", "Have a productive day!"], ["Good morning, {n}!", "Wishing you a bright and focused day ahead."], ["Welcome in, {n}!", "Make today a great one."]],
        afternoon: [["Good afternoon, {n}!", "Hope the rest of your day goes smoothly."], ["Welcome, {n}!", "Let's make the afternoon count."]],
        evening:   [["Good evening, {n}!", "Thanks for being here. Have a smooth shift."]],
      },
      out: {
        day:     [["Thank you, {n}!", "Take care, and see you soon."], ["Thanks for your hard work, {n}!", "Have a good rest of the day."]],
        evening: [["Thank you, {n}!", "Get some fresh air, spend time with family & friends."], ["Great work today, {n}!", "Switch off, relax and enjoy your evening."], ["Well done, {n}!", "Step outside, take a walk, call someone you love."]],
        night:   [["Thank you, {n}!", "Get home safe and rest well."]],
      },
    };
    const pick = (a) => a[Math.floor(Math.random() * a.length)];
    function greeting(r) {
      const h = r.hour, first = r.name.split(" ")[0];
      const [head, sub] = r.action === "check_in"
        ? pick(GREET.in[h < 12 ? "morning" : h < 17 ? "afternoon" : "evening"])
        : pick(GREET.out[h < 17 ? "day" : h < 21 ? "evening" : "night"]);
      return [head.replace("{n}", first), sub];
    }

    // ---- Screens ----
    async function card({ tick, error, title, name, dept, emp, action, actionText }) {
      $("popup").classList.toggle("err", !!error);
      $("tick").classList.toggle("hidden", !tick);
      $("pTitle").textContent = title || "";
      $("pName").textContent = name || "";
      $("pDept").textContent = dept || "";
      $("pEmp").textContent = emp ? "ID " + emp : "";
      $("manIn").classList.toggle("hidden", !tick || action !== "check_in");
      $("manOut").classList.toggle("hidden", !tick || action !== "check_out");
      $("pAction").textContent = actionText || "";
      $("pAction").className = tick ? (action === "check_in" ? "in" : "out") : "";
      $("popup").classList.remove("hidden");
      await sleep(POPUP_MS);
      $("popup").classList.add("hidden");
    }
    const timeText = (r) => new Date(r.occurred_at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    const verb = (r) => (r.action === "check_in" ? "Checked in" : "Checked out") + " at " + timeText(r);

    async function showRecorded(r) {
      await card({ tick: true, title: "Captured", name: r.name, dept: r.department || "No department", emp: r.employee_id, action: r.action, actionText: verb(r) });
      const [head, sub] = greeting(r);
      $("gHead").textContent = head;
      $("gSub").textContent = sub;
      $("greeting").classList.toggle("out", r.action === "check_out");
      $("greeting").classList.remove("hidden");
      await sleep(GREETING_MS);
      $("greeting").classList.add("hidden");
    }

    // Every non-recorded outcome is an error card; `r` is the API result.
    const ERRORS = {
      unknown:           (r) => ({ title: "Oops!", name: "It seems your data haven't registered", dept: "Please contact " + (r.contact || "an administrator") }),
      already_checked_in:(r) => ({ title: "Already checked in", name: r.name, dept: r.department, actionText: "Choose Check out when you leave" }),
      not_checked_in:    (r) => ({ title: "You haven't checked in today", name: r.name, dept: r.department, actionText: "Choose Check in first" }),
      expired:           ()  => ({ title: "Session expired", name: "Please look at the camera again" }),
      no_face:           ()  => ({ title: "Face not clear", name: "We couldn't get a clear view of your face", dept: "Face the camera, remove anything covering it and try again" }),
      unavailable:       ()  => ({ title: "Service unavailable", name: "Please try again in a moment" }),
    };

    // ---- Flow: face held 3 s -> identify -> confirm window (Check in / Check out / X) -> record -> popup + greeting ----
    let busy = false, since = null, misses = 0, noFace = 0, needClear = false, clearSince = null;

    // Resolves with "check_in" / "check_out", or null if the person closes the window (X) or it times out.
    function confirmPerson(p) {
      return new Promise((resolve) => {
        $("cName").textContent = p.name;
        $("cDept").textContent = p.department || "No department";
        $("cEmp").textContent = p.employee_id ? "ID " + p.employee_id : "";
        $("btnIn").disabled = p.checked_in === true;     // only the valid action is enabled
        $("btnOut").disabled = p.checked_in === false;
        $("confirm").classList.remove("hidden");
        const done = (choice) => {
          clearTimeout(timer);
          $("confirm").classList.add("hidden");
          $("close").onclick = $("btnIn").onclick = $("btnOut").onclick = null;
          resolve(choice);
        };
        const timer = setTimeout(() => done(null), CONFIRM_MS);
        $("close").onclick = () => done(null);
        $("btnIn").onclick = () => done("check_in");
        $("btnOut").onclick = () => done("check_out");
      });
    }

    async function identify() {
      busy = true; since = null;
      document.body.classList.remove("counting");
      setPrompt("Recognizing...");
      try {
        const r = await post("/kiosk/identify", { image: frame(640, 0.85) });
        if (r.status === "no_face" && ++noFace < 3) { setPrompt("Couldn't see you clearly. Face the camera"); return; }
        noFace = 0; needClear = true;
        if (r.status !== "matched") { await card({ error: true, ...ERRORS[r.status](r) }); return; }

        const choice = await confirmPerson(r);
        if (!choice) return;   // wrong person or timed out: nothing is recorded
        setPrompt("Saving...");
        const rec = await post("/kiosk/record", { match_token: r.match_token, action: choice });
        if (rec.status === "recorded") await showRecorded(rec);
        else await card({ error: true, ...ERRORS[rec.status](rec) });
      } catch (e) {
        if (e.message === "auth") return;
        noFace = 0; needClear = true;
        await card({ error: true, ...ERRORS.unavailable() });
      } finally { busy = false; }
    }

    async function tick() {
      try {
        const img = busy ? null : frame(480, 0.6);
        if (img) {
          const { faces } = await post("/kiosk/detect", { image: img });
          const now = Date.now();
          if (needClear) {
            if (faces === 0) { clearSince ??= now; if (now - clearSince >= CLEAR_MS) { needClear = false; clearSince = null; } }
            else clearSince = null;
            setPrompt(faces ? "Please step away, then look at the camera again" : "Look at the camera");
          } else if (faces === 1) {
            misses = 0; since ??= now;
            const left = Math.ceil((HOLD_MS - (now - since)) / 1000);
            if (left > 0) { document.body.classList.add("counting"); setPrompt("Hold still... " + left); }
            else await identify();
          } else if (++misses >= 2) {   // tolerate one missed detection
            since = null; document.body.classList.remove("counting");
            setPrompt(faces > 1 ? "One person at a time, please" : "Look at the camera");
          }
        }
      } catch (e) {
        if (e.message !== "auth") { since = null; setPrompt("Service unavailable. Retrying..."); }
      }
      setTimeout(tick, 500);
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" }, audio: false });
        stream.getVideoTracks()[0].addEventListener("ended", () => $("camError").classList.remove("hidden"));
        $("cam").srcObject = stream;
        $("camError").classList.add("hidden");
        try { await navigator.wakeLock.request("screen"); } catch { }   // keep the screen on; not available everywhere
      } catch { $("camError").classList.remove("hidden"); }
    }
    $("retry").addEventListener("click", startCamera);
    startCamera();
    tick();
  </script>
</body>
</html>
