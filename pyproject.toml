[build-system]
requires = ["setuptools>=40.8.0"]
build-backend = "setuptools.build_meta"


[project]
name = "jetson-face-recognition"
version = "0.1.0"
description = "Django, FastAPI and face recognition application for Jetson"
requires-python = ">=3.8,<3.9"
dependencies = [
    # Web Framework
    "Django==2.2.28",
    "channels==2.4.0",
    # Face Recognition
    "torch==1.8.0",
    "torchvision==0.9.0",
    "facenet-pytorch==2.5.2",
    "mtcnn==0.1.1",
    # Image Processing
    "opencv-python==4.5.3.56",
    "Pillow==8.4.0",
    "numpy==1.19.5",
    # API and Async
    "fastapi==0.65.2",
    "uvicorn",
    "aiohttp==3.7.4",
    # HTTP and Network
    "requests==2.27.1",
    # Data Processing
    "pydantic==1.8.2",
    # Utils
    "python-dotenv==0.19.2",
]
