[build-system]
requires = ["setuptools>=40.8.0"]
build-backend = "setuptools.build_meta"


[project]
name = "staff-face-recognition"
version = "0.2.0"
description = "Face Recognition system for staff attendance system"
requires-python = ">=3.12"
dependencies = [
    # Web Framework
    "Django>=5.1,<6.0",
    "channels>=4.1",
    # Face Recognition
    "torch>=2.2",
    "torchvision>=0.17,<0.18",
    "facenet-pytorch>=2.6.0",
    "ultralytics>=8.3",
    # Image Processing
    "opencv-python>=4.10",
    "Pillow>=10.2,<10.3",
    "numpy>=1.26,<2",
    # API and Async
    "fastapi[standard]>=0.115",
    "uvicorn[standard]",
    "websockets>=13.0",
    "python-multipart>=0.0.9",
    "aiohttp>=3.10",
    # HTTP and Network
    "requests>=2.32",
    # Vector search + cache/pubsub
    "qdrant-client>=1.11",
    "redis>=5.0",
    # Data Processing
    "pydantic>=2.9",
    # Utils
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "cryptography>=43",
    "alembic>=1.13",
    "pydantic-settings>=2.5",
    "email-validator>=2.2",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "jinja2>=3.1",
    "tzdata>=2026.5",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
